# Local Pi/Venice experiment. This file is selected only with ARTIDEZI_LOCAL_HARNESS=pi.
schema_version: 1
instance:
  name: local-pi
  bot_identity: {name: ArtiDezi, email: artidezi@local.invalid}
  data_dir: /data
  admin_token_ref: admin-token
model_endpoints:
  venice:
    provider: openai
    auth_mode: openai_api_key
    credential_ref: venice
    base_url: https://api.venice.ai/api/v1
worker_pools:
  local:
    harness_sandbox: disabled
    harnesses: [pi]
    workers:
      local-pi-worker: {token_ref: worker-token}
agent_profiles:
  pi-venice:
    harness: pi
    harness_version_constraint: "=0.85.1"
    model: deepseek-v4-1-flash
    model_settings: {thinking: off}
    model_endpoint: venice
    worker_pool: local
forges:
  local:
    provider: forgejo
    api_base_url: http://forgejo:3000
    web_base_url: http://artidezi-forgejo.127.0.0.1.nip.io:${ARTIDEZI_FORGEJO_PORT}
    credential_ref: forgejo-token
    bot_login: artidezi
projects:
  playground:
    description: A local Pi/Venice harness experiment against the throwaway Forgejo playground.
    default_agent_profile: pi-venice
    allowed_agent_profiles: [pi-venice]
    default_delivery_mode: merge_request
    allowed_delivery_modes: [merge_request]
    draft_merge_requests: false
    network:
      command_egress: {mode: public_internet, denied_domains: [], private_network: blocked, allowed_private_endpoints: []}
      web_search: {mode: live, domain_scope: public_internet}
    limits:
      wall_clock_seconds: 1800
      result_json_max_bytes: 65536
      max_commits_per_repository: 5
      max_diff_bytes_per_repository: 65536
      max_commit_message_bytes: 1024
    effects:
      merge_renovate_merge_request_on_safe_verdict: false
      publish_adaptation_merge_requests: true
    repositories:
      playground:
        forge: local
        remote: artidezi/playground
        branch: main
        description: A throwaway fixture for the local Pi experiment.
        agent_access: read_write
        allowed_paths: ['notes/*.md', 'FAIL_CHECK']
        verification_recipe: []
