version = 1

# Computer-generated files and other files which cannot be copyrighted
[[annotations]]
path = [
    ".dockerignore",
    ".editorconfig",
    ".gitignore",
    "Cargo.lock",
    "rust-toolchain.toml",
    "**/Cargo.toml",
    "Cargo.toml",
    ".github/renovate.json",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Generated raster artwork; the editable SVG carries its own license header.
[[annotations]]
path = ["assets/branding/*.png"]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Formats without a comfortable comment syntax for headers
[[annotations]]
path = [".github/workflows/*.yml"]
SPDX-FileCopyrightText = "2026 Slavi Pantaleev"
SPDX-License-Identifier = "Apache-2.0"
