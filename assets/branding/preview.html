<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArtiDezi branding preview</title>
  <link rel="icon" type="image/svg+xml" href="artidezi-bot.svg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7f8; color: #172b3a; font: 16px system-ui, sans-serif; }
    header { background: #172b3a; padding: 20px 32px; }
    .brand { display: flex; gap: 10px; align-items: center; color: #fff; font-size: 24px; font-weight: 700; letter-spacing: -.8px; }
    .period { color: #eab489; }
    main { max-width: 1100px; margin: auto; padding: 32px; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    h2 { font-size: 20px; margin: 0; }
    .row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; margin-top: 24px; }
    section { background: white; padding: 24px; border-radius: 16px; margin-top: 24px; }
    figure { margin: 0; display: grid; gap: 12px; justify-items: center; }
    figcaption { font-size: 16px; }
    img { display: block; }
    .circle { border-radius: 50%; }
    p { max-width: 65ch; }
    .dark { background: #172b3a; color: #fff; }
    .comparison { display: flex; align-items: center; gap: 48px; flex-wrap: wrap; }
    @media (max-width: 600px) { main { padding: 20px; } .comparison { gap: 24px; } }
  </style>
</head>
<body>
  <header><div class="brand"><img src="artidezi-bot.svg" width="40" height="40" alt=""><span>ArtiDezi<span class="period">.</span></span></div></header>
  <main>
    <h1>One face, two formats</h1>
    <p>The rendered bot avatar and its simplified vector companion for the website.</p>
    <section class="comparison">
      <figure><img class="circle" src="artidezi-bot-avatar-v1.png" width="256" height="256" alt="Rendered ArtiDezi avatar"><figcaption>Bot avatar · PNG</figcaption></figure>
      <figure><img src="artidezi-bot.svg" width="256" height="256" alt="Vector ArtiDezi logo"><figcaption>Website logo · SVG</figcaption></figure>
    </section>
    <section class="dark">
      <h2>Website logo on navy</h2>
      <div class="row">
      <figure><img class="" src="artidezi-bot.svg" width="128" height="128" alt="ArtiDezi robot"><figcaption>128px</figcaption></figure>
      <figure><img class="" src="artidezi-bot.svg" width="64" height="64" alt="ArtiDezi robot"><figcaption>64px</figcaption></figure>
      <figure><img class="" src="artidezi-bot.svg" width="40" height="40" alt="ArtiDezi robot"><figcaption>40px</figcaption></figure>
      <figure><img class="" src="artidezi-bot.svg" width="32" height="32" alt="ArtiDezi robot"><figcaption>32px</figcaption></figure>
      <figure><img class="" src="artidezi-bot.svg" width="16" height="16" alt="ArtiDezi robot"><figcaption>16px</figcaption></figure>
      </div>
    </section>
    <section>
      <h2>Website logo on light</h2>
      <div class="row">
      <figure><img class="" src="artidezi-bot.svg" width="128" height="128" alt="ArtiDezi robot"><figcaption>128px</figcaption></figure>
      <figure><img class="" src="artidezi-bot.svg" width="64" height="64" alt="ArtiDezi robot"><figcaption>64px</figcaption></figure>
      <figure><img class="" src="artidezi-bot.svg" width="40" height="40" alt="ArtiDezi robot"><figcaption>40px</figcaption></figure>
      <figure><img class="" src="artidezi-bot.svg" width="32" height="32" alt="ArtiDezi robot"><figcaption>32px</figcaption></figure>
      <figure><img class="" src="artidezi-bot.svg" width="16" height="16" alt="ArtiDezi robot"><figcaption>16px</figcaption></figure>
      </div>
    </section>
    <section>
      <h2>Circular avatar</h2>
      <div class="row">
      <figure><img class="circle" src="artidezi-bot-avatar-v1.png" width="128" height="128" alt="ArtiDezi robot"><figcaption>128px</figcaption></figure>
      <figure><img class="circle" src="artidezi-bot-avatar-v1.png" width="64" height="64" alt="ArtiDezi robot"><figcaption>64px</figcaption></figure>
      <figure><img class="circle" src="artidezi-bot-avatar-v1.png" width="40" height="40" alt="ArtiDezi robot"><figcaption>40px</figcaption></figure>
      <figure><img class="circle" src="artidezi-bot-avatar-v1.png" width="32" height="32" alt="ArtiDezi robot"><figcaption>32px</figcaption></figure>
      <figure><img class="circle" src="artidezi-bot-avatar-v1.png" width="16" height="16" alt="ArtiDezi robot"><figcaption>16px</figcaption></figure>
      </div>
    </section>
  </main>
</body>
</html>
