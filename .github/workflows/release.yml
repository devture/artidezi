name: Release

# Cuts CalVer releases (vYYYY.MM.DD.N) from main without a human picking a version.
# release/plan-release.py decides when:
# unforced runs wait for green CI, for main to be quiet for 30 minutes (waiting within the run: scheduled runs are unreliable)
# and for Renovate updates to the image that may still land, so a burst of commits becomes 1 release.
# Manual runs release main right away if the image changed and CI passed; a waiting run steps aside for them.
# The tag is pushed by this workflow (GITHUB_TOKEN tags trigger no other workflows),
# so it validates and publishes the release itself, then creates its GitHub Release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Version numbers derive from existing tags; never let 2 runs compute one at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    # The planner may wait out the 30-minute quiet period within the run.
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether main should be released now
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 release/plan-release.py

  checks:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.plan.outputs.version }}

  tag:
    needs: [plan, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the tested commit
        id: tag
        # bash (not the default `bash -e`) adds pipefail, so a failing ls-remote fails the job.
        shell: bash
        env:
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          # If main moved on while the checks ran, a later run releases the newer head.
          # (With GITHUB_TOKEN, tagging an older workflow revision can also be rejected without workflows permission.)
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Not releasing $GITHUB_SHA: main has moved on to $head; a later run decides for it"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate --message "artidezi $TAG" "$TAG" "$GITHUB_SHA"
          # Fails rather than moves the tag if it already exists.
          git push origin "refs/tags/$TAG"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [plan, tag]
    if: needs.tag.outputs.tagged == 'true'
    uses: ./.github/workflows/publish-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      channel: stable
      version: ${{ needs.plan.outputs.version }}

  github-release:
    needs: [plan, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      # For the build provenance attestation of the worker binaries, and its storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      # Workers run the image's static binary directly, usually on a VM without Docker.
      - name: Extract the worker binaries from the tested images
        run: |
          mkdir "$RUNNER_TEMP/binaries"
          for arch in amd64 arm64; do
            docker image load --input "$RUNNER_TEMP/images/image-$arch.tar"
            container=$(docker create --platform "linux/$arch" artidezi:candidate)
            docker cp "$container:/usr/local/bin/artidezi" "$RUNNER_TEMP/binaries/artidezi-linux-$arch"
            docker rm "$container"
          done
          cd "$RUNNER_TEMP/binaries"
          sha256sum artidezi-linux-* > SHA256SUMS
      # Lets anyone check that a binary was built by this workflow from a commit of this repository:
      # gh attestation verify artidezi-linux-amd64 --owner devture
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/binaries/artidezi-linux-*
      - name: Create the GitHub Release once its images are published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          python3 release/release-notes.py "$PREVIOUS" "$GITHUB_SHA" "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --latest --title "$TAG" "$RUNNER_TEMP"/binaries/*
